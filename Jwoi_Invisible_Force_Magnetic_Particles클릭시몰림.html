<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J.woi | 보이지 않는 힘</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01040d;color:#d8eeff;font-family:system-ui,'Malgun Gothic',sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.panel{position:fixed;top:20px;left:20px;z-index:2;padding:18px 20px;background:rgba(5,15,32,.64);border:1px solid rgba(121,190,255,.2);border-radius:18px;backdrop-filter:blur(16px);box-shadow:0 12px 50px #0006;max-width:min(340px,calc(100vw - 40px))}h1{font-size:19px;font-weight:600;letter-spacing:.1em;margin:0 0 5px}.sub{font-size:11px;letter-spacing:.12em;color:#8fb7d5;margin-bottom:16px}.setting{display:flex;align-items:center;gap:10px;font-size:13px}.setting input{flex:1;accent-color:#72caff;min-width:80px}output{font-variant-numeric:tabular-nums;min-width:34px;text-align:right}.actions{display:flex;gap:8px;margin-top:14px}button{cursor:pointer;color:#d9f4ff;background:#10243c;border:1px solid #345575;border-radius:9px;padding:8px 14px;font:inherit;font-size:12px}button:hover{background:#1d4464}.hint{margin-top:12px;color:#88a8c3;font-size:11px;line-height:1.6}.error{display:none;position:fixed;bottom:15px;left:15px;right:15px;background:#401b25;color:#fff;padding:12px;border-radius:10px;z-index:5;white-space:pre-wrap}@media(max-width:550px){.panel{top:12px;left:12px;padding:12px 14px}h1{font-size:16px}.sub{margin-bottom:10px}}</style></head><body><canvas id="art" aria-label="마우스 움직임에 반응하는 자석 파티클 아트"></canvas><section class="panel"><h1>보이지 않는 힘</h1><div class="sub">INVISIBLE FORCE · J.WOI MEDIA ART</div><label class="setting" for="strength">자기장 세기 <input id="strength" type="range" min="0" max="100" value="55"><output id="value">55</output></label><div class="actions"><button id="toggle">일시정지</button><button id="reset">초기화</button></div><div class="hint">마우스를 움직이면 입자가 끌려옵니다.<br>클릭하거나 터치하면 빛이 밀려납니다.</div></section><div id="error" class="error" role="alert"></div><script>
(()=>{'use strict';try{const canvas=document.getElementById('art'),ctx=canvas.getContext('2d',{alpha:false});if(!ctx)throw Error('Canvas 2D를 지원하지 않는 브라우저입니다.');const slider=document.getElementById('strength'),out=document.getElementById('value'),toggle=document.getElementById('toggle'),reset=document.getElementById('reset');let W=0,H=0,dpr=1,particles=[],running=true,frame=0,last=0;const mouse={x:0,y:0,active:false},pulses=[];let n=650;function random(a,b){return a+Math.random()*(b-a)}function makeParticle(){const x=random(0,W),y=random(0,H);return{x,y,vx:random(-.35,.35),vy:random(-.35,.35),homeX:x,homeY:y,r:random(.6,2.15),hue:Math.random()<.18?0:random(195,221),seed:random(0,Math.PI*2),mass:random(.7,1.5)}}function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);n=Math.min(850,Math.max(270,Math.round(W*H/1650)));particles=Array.from({length:n},makeParticle);mouse.active=false}function burst(x,y){pulses.push({x,y,r:0,life:1});for(const p of particles){const dx=p.x-x,dy=p.y-y,d2=dx*dx+dy*dy;if(d2<210*210){const d=Math.sqrt(d2)||1;const power=(1-d/210)*random(9,17);p.vx+=dx/d*power;p.vy+=dy/d*power}}}function update(dt){const strength=+slider.value/100;frame+=dt;for(const p of particles){let ax=Math.sin(frame*.006+p.seed)*.012,ay=Math.cos(frame*.004+p.seed*1.7)*.012; if(mouse.active){const dx=mouse.x-p.x,dy=mouse.y-p.y,d2=dx*dx+dy*dy;const range=310;if(d2<range*range&&d2>16){const d=Math.sqrt(d2);const fall=Math.pow(1-d/range,2);const force=fall*strength*.88/p.mass;ax+=dx/d*force;ay+=dy/d*force}}p.vx=(p.vx+ax*dt)*Math.pow(.974,dt);p.vy=(p.vy+ay*dt)*Math.pow(.974,dt);const speed=Math.hypot(p.vx,p.vy),max=6.4;if(speed>max){p.vx=p.vx/speed*max;p.vy=p.vy/speed*max}p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<-12)p.x=W+12;if(p.x>W+12)p.x=-12;if(p.y<-12)p.y=H+12;if(p.y>H+12)p.y=-12}for(let i=pulses.length-1;i>=0;i--){pulses[i].r+=11*dt;pulses[i].life-=.025*dt;if(pulses[i].life<=0)pulses.splice(i,1)}}function draw(){ctx.fillStyle='#01040d';ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(W*.5,H*.48,0,W*.5,H*.48,Math.max(W,H)*.7);g.addColorStop(0,'rgba(8,27,58,.62)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';if(mouse.active){const r=210+(+slider.value)*1.15;const mg=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,r);mg.addColorStop(0,'rgba(32,133,240,.11)');mg.addColorStop(.55,'rgba(20,100,200,.035)');mg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mouse.x,mouse.y,r,0,Math.PI*2);ctx.fill()}for(const p of particles){const color=p.hue===0?'235,246,255':'91,182,255';const radius=p.r*3.8;const glow=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,radius);glow.addColorStop(0,`rgba(${color},.82)`);glow.addColorStop(.25,`rgba(${color},.28)`);glow.addColorStop(1,`rgba(${color},0)`);ctx.fillStyle=glow;ctx.beginPath();ctx.arc(p.x,p.y,radius,0,Math.PI*2);ctx.fill();ctx.fillStyle=p.hue===0?'#f7fcff':'#a5dcff';ctx.globalAlpha=.65+.25*Math.sin(frame*.02+p.seed);ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.4,p.r*.53),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}for(const pulse of pulses){ctx.strokeStyle=`rgba(116,207,255,${pulse.life*.5})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(pulse.x,pulse.y,pulse.r,0,Math.PI*2);ctx.stroke()}ctx.globalCompositeOperation='source-over'}function loop(now){requestAnimationFrame(loop);if(!running){last=now;return}const dt=Math.min((now-(last||now))/16.6667,2);last=now;update(dt);draw()}canvas.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true});canvas.addEventListener('pointerenter',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true});canvas.addEventListener('pointerleave',()=>{mouse.active=false});canvas.addEventListener('pointerdown',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true;burst(e.clientX,e.clientY)});slider.addEventListener('input',()=>out.value=slider.value);toggle.addEventListener('click',()=>{running=!running;toggle.textContent=running?'일시정지':'재생'});reset.addEventListener('click',()=>{particles=Array.from({length:n},makeParticle);pulses.length=0;frame=0;draw()});addEventListener('resize',resize);resize();requestAnimationFrame(loop)}catch(e){const el=document.getElementById('error');el.style.display='block';el.textContent='실행 오류: '+(e&&e.message?e.message:String(e));console.error(e)}})();
</script></body></html>
