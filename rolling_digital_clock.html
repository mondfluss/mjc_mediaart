<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>롤링 디지털 시계</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden}
  body{
    background:radial-gradient(ellipse at 50% 45%,#142039 0%,#080d19 48%,#03060c 100%);
    color:#fff;font-family:Inter,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;
  }
  .scene{width:min(1100px,96vw);height:min(620px,90vh);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .glow{position:absolute;width:min(760px,85vw);height:280px;top:50%;left:50%;transform:translate(-50%,-50%);background:#3c82ff;filter:blur(110px);opacity:.13;pointer-events:none}
  .eyebrow{position:absolute;top:9%;font-size:11px;letter-spacing:.48em;color:#7992b8;text-transform:uppercase}
  .clock-wrap{position:relative;width:100%;display:flex;justify-content:center;align-items:center}
  canvas{width:100%;height:auto;max-height:54vh;display:block}
  .date{position:absolute;bottom:13%;font-size:clamp(12px,1.8vw,16px);letter-spacing:.28em;color:#8ea4c7;text-align:center}
  .hint{position:absolute;bottom:6%;font-size:10px;letter-spacing:.2em;color:#50617d}
  @media(max-width:600px){.scene{height:80vh}.eyebrow{top:15%}.date{bottom:18%}.hint{bottom:10%}canvas{max-height:38vh}}
</style>
</head>
<body>
<div class="scene">
  <div class="glow"></div>
  <div class="eyebrow">DIGITAL TIME · LIVE MOTION</div>
  <div class="clock-wrap"><canvas id="clock" width="1100" height="430"></canvas></div>
  <div class="date" id="date"></div>
  <div class="hint">SECONDS IN MOTION</div>
</div>
<script>
(() => {
  const canvas = document.getElementById('clock');
  const ctx = canvas.getContext('2d');
  const W=1100,H=430;
  const DIGIT_SPACING=50, COLUMN_SPACING=26, DIGIT_SIZE=50;
  const EASING=0.1, GRAVITY=1;
  const columnWidth=DIGIT_SIZE+ COLUMN_SPACING;
  const totalWidth=columnWidth*6 + 2*50;
  const startX=(W-totalWidth)/2;
  const centerY=H/2;
  const cols=[];
  let previousDigits=null;
  const pad=n=>String(n).padStart(2,'0');
  const maxFor=i=>[2,9,5,9,5,9][i];

  function getTimeDigits(){
    const d=new Date();
    return [...(pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds()))].map(Number);
  }
  function setup(){
    for(let i=0;i<6;i++){
      cols.push({x:startX+i*columnWidth+(i>=2?50:0)+(i>=4?50:0), y:0,target:0,velocity:0,fall:0,old:0});
    }
  }
  function roundedRect(x,y,w,h,r){
    ctx.beginPath();ctx.roundRect(x,y,w,h,r);
  }
  function drawDigitWheel(col,index,dt){
    const spacing=DIGIT_SPACING;
    const diff=col.target-col.y;
    col.velocity += diff*EASING;
    col.velocity *= .78;
    col.y += col.velocity;
    if(Math.abs(diff)<.001 && Math.abs(col.velocity)<.001){col.y=col.target;col.velocity=0}
    if(col.fall>0){col.fall+=GRAVITY*dt; if(col.fall>24)col.fall=0}
    const centerIndex=Math.round(col.y);
    for(let offset=-4;offset<=4;offset++){
      const value=((centerIndex+offset)%10+10)%10;
      const delta=(centerIndex+offset-col.y);
      const y=centerY+delta*spacing + (offset===0?col.fall:0);
      const distance=Math.abs(delta);
      const alpha=Math.max(.08,1-distance*.22);
      const scale=1-distance*.055;
      const isCurrent=offset===0 && Math.abs(diff)<.48;
      ctx.save();
      ctx.translate(col.x+ DIGIT_SIZE/2,y);
      ctx.scale(scale,scale);
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.font=`${isCurrent?'600':'400'} 48px "Segoe UI", Arial, sans-serif`;
      ctx.shadowBlur=isCurrent?24:0;
      ctx.shadowColor='#8fc5ff';
      ctx.fillStyle=isCurrent?`rgba(255,255,255,${alpha})`:`rgba(132,157,194,${alpha*.72})`;
      ctx.fillText(value,0,0);
      ctx.restore();
    }
  }
  function drawColon(x){
    ctx.save();ctx.fillStyle='rgba(135,177,230,.78)';ctx.shadowColor='#63a9ff';ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(x,centerY-17,4,0,Math.PI*2);ctx.arc(x,centerY+17,4,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  function drawFrame(now){
    const dt=Math.min(2,(now-(drawFrame.last||now))/16.67);drawFrame.last=now;
    ctx.clearRect(0,0,W,H);
    // subtle horizontal light band
    const band=ctx.createLinearGradient(0,centerY-100,0,centerY+100);
    band.addColorStop(0,'rgba(60,120,220,0)');
    band.addColorStop(.5,'rgba(60,120,220,.075)');
    band.addColorStop(1,'rgba(60,120,220,0)');
    ctx.fillStyle=band;ctx.fillRect(0,centerY-100,W,200);
    const digits=getTimeDigits();
    if(!previousDigits){
      digits.forEach((d,i)=>{cols[i].y=d;cols[i].target=d});
      previousDigits=digits.slice();
    }
    digits.forEach((d,i)=>{
      if(d!==previousDigits[i]){
        cols[i].target=d;
        // The wheel advances naturally; a rollover gets a small gravity kick.
        if(d===0 && previousDigits[i]===maxFor(i)){
          cols[i].fall=-8;
          cols[i].velocity=-.5;
        }
      }
    });
    cols.forEach((c,i)=>drawDigitWheel(c,i,dt));
    drawColon(cols[1].x+columnWidth+12);
    drawColon(cols[3].x+columnWidth+12);
    previousDigits=digits.slice();
    const d=new Date();
    document.getElementById('date').textContent=d.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
    requestAnimationFrame(drawFrame);
  }
  setup();requestAnimationFrame(drawFrame);
})();
</script>
</body>
</html>
