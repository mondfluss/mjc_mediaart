<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>J.woi — Digital Sand Garden</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060c;color:#e9eaf5}canvas{display:block;width:100vw;height:100dvh;touch-action:none;cursor:crosshair}.panel{position:fixed;top:18px;left:18px;max-width:calc(100vw - 36px);display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(12,15,27,.82);border:1px solid #ffffff24;box-shadow:0 10px 38px #0008;backdrop-filter:blur(18px);border-radius:16px;padding:11px 13px}.brand{font-size:12px;letter-spacing:.14em;color:#aeb4c8;margin-right:7px;white-space:nowrap}button,select,input{font:inherit}button,select{border:1px solid #ffffff25;background:#1a2030;color:#eef1ff;border-radius:9px;padding:8px 10px;cursor:pointer}button:hover,select:hover{background:#29334b}button.active{border-color:#9b9fff;background:#343c65}label{font-size:11px;color:#c0c6d9;display:flex;align-items:center;gap:6px}input[type=range]{width:70px;accent-color:#b39cff}input[type=color]{width:32px;height:30px;padding:2px;background:transparent;border:1px solid #ffffff40;border-radius:7px;cursor:pointer}.stat{position:fixed;right:20px;bottom:16px;font-size:11px;letter-spacing:.07em;color:#b9c0d0aa;pointer-events:none}.hint{position:fixed;left:20px;bottom:16px;font-size:11px;color:#b9c0d099;pointer-events:none}#error{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;max-width:90vw;background:#4b1423;color:white;border:1px solid #ff8b9d;padding:20px;border-radius:12px;white-space:pre-wrap}@media(max-width:620px){.panel{top:10px;left:10px;max-width:calc(100vw - 20px);gap:7px;padding:9px}.brand{width:100%;font-size:10px}button,select{padding:7px 8px;font-size:12px}.hint{display:none}.stat{bottom:10px;right:10px}}
</style></head><body><canvas id="scene" aria-label="중력에 따라 떨어지는 모래와 물을 그리는 캔버스"></canvas><div class="panel"><span class="brand">J.WOI / DIGITAL SAND GARDEN</span><button id="sand" class="active">✦ 모래</button><button id="water">≈ 물</button><label>색상 <input id="color" type="color" value="#f6a54c"></label><label>크기 <input id="brush" type="range" min="1" max="11" value="4"></label><label>양 <input id="amount" type="range" min="1" max="8" value="4"></label><button id="play">Ⅱ 정지</button><button id="reset">↺ 초기화</button></div><div class="hint">드래그하여 입자를 뿌려보세요 · 물은 모래 위를 흐릅니다</div><div class="stat" id="stat">0 particles</div><div id="error" role="alert"></div><script>
(()=>{'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false}),error=document.getElementById('error');
function fail(e){error.style.display='block';error.textContent='실행 오류: '+(e?.message||String(e))+'\nChrome 최신 버전에서 다시 실행해 주세요.';console.error(e)}
window.addEventListener('error',e=>fail(e.error||e.message));window.addEventListener('unhandledrejection',e=>fail(e.reason));
if(!ctx){fail('Canvas 2D를 지원하지 않는 브라우저입니다.');return}
const sandBtn=document.getElementById('sand'),waterBtn=document.getElementById('water'),colorEl=document.getElementById('color'),brushEl=document.getElementById('brush'),amountEl=document.getElementById('amount'),playBtn=document.getElementById('play'),resetBtn=document.getElementById('reset'),statEl=document.getElementById('stat');
let W=0,H=0,cell=4,grid,shade,stamp,buffer,img,count=0,frame=1,mode=1,playing=true,down=false,last=null,seed=987654321,acc=0,prev=0,raf=0,statTick=0;
function random(){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return(seed>>>0)/4294967296}
function rgb(hex){return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]}
function resize(){let oldG=grid,oldS=shade,ow=W,oh=H;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);ctx.imageSmoothingEnabled=false;cell=Math.max(3,Math.ceil(Math.sqrt(canvas.width*canvas.height/49000)));W=Math.ceil(canvas.width/cell);H=Math.ceil(canvas.height/cell);grid=new Uint8Array(W*H);shade=new Uint32Array(W*H);stamp=new Uint32Array(W*H);if(oldG){for(let y=0;y<H;y++)for(let x=0;x<W;x++){let ox=Math.min(ow-1,Math.floor(x*ow/W)),oy=Math.min(oh-1,Math.floor(y*oh/H)),src=oy*ow+ox,dst=y*W+x;grid[dst]=oldG[src];shade[dst]=oldS[src]}}buffer=document.createElement('canvas');buffer.width=W;buffer.height=H;img=buffer.getContext('2d',{alpha:false}).createImageData(W,H);count=grid.reduce((a,b)=>a+(b!==0),0)}
function setMode(m){mode=m;sandBtn.classList.toggle('active',m===1);waterBtn.classList.toggle('active',m===2);if(m===2&&colorEl.value==='#f6a54c')colorEl.value='#48cfff'}
sandBtn.onclick=()=>setMode(1);waterBtn.onclick=()=>setMode(2);playBtn.onclick=()=>{playing=!playing;playBtn.textContent=playing?'Ⅱ 정지':'▶ 시작'};resetBtn.onclick=()=>{grid.fill(0);shade.fill(0);stamp.fill(0);count=0};
function place(x,y){if(x<0||x>=W||y<0||y>=H)return;let i=y*W+x;if(grid[i])return;grid[i]=mode;let [r,g,b]=rgb(colorEl.value),n=(random()-.5)*38;shade[i]=((Math.max(0,Math.min(255,r+n))|0)<<16)|((Math.max(0,Math.min(255,g+n))|0)<<8)|(Math.max(0,Math.min(255,b+n))|0);count++}
function paint(x,y){let radius=+brushEl.value,amt=+amountEl.value;for(let k=0;k<amt*radius*3;k++){let dx=(random()*2-1)*radius,dy=(random()*2-1)*radius;if(dx*dx+dy*dy<=radius*radius)place(Math.floor(x+dx),Math.floor(y+dy))}}
function point(e){const rect=canvas.getBoundingClientRect();return{x:(e.clientX-rect.left)/rect.width*W,y:(e.clientY-rect.top)/rect.height*H}}
function drawLine(a,b){let steps=Math.min(180,Math.max(1,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)*1.6)));for(let i=0;i<=steps;i++){let t=i/steps;paint(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t)}}
canvas.addEventListener('pointerdown',e=>{down=true;canvas.setPointerCapture(e.pointerId);last=point(e);paint(last.x,last.y)});canvas.addEventListener('pointermove',e=>{if(!down)return;let p=point(e);drawLine(last,p);last=p});for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,()=>{down=false;last=null});
function swap(i,j){grid[j]=grid[i];shade[j]=shade[i];grid[i]=0;shade[i]=0;stamp[j]=frame;return true}
function tick(){frame++;let flip=frame&1;for(let y=H-2;y>=0;y--){let leftToRight=((y+flip)&1)===0;for(let k=0;k<W;k++){let x=leftToRight?k:W-1-k,i=y*W+x,type=grid[i];if(!type||stamp[i]===frame)continue;let below=i+W;if(grid[below]===0){swap(i,below);continue}if(type===1){let d=random()<.5?-1:1;let xx=x+d;if(xx>=0&&xx<W&&grid[below+d]===0){swap(i,below+d);continue}xx=x-d;if(xx>=0&&xx<W&&grid[below-d]===0){swap(i,below-d);continue}if(grid[below]===2){let old=shade[i];grid[i]=2;shade[i]=shade[below];grid[below]=1;shade[below]=old;stamp[below]=frame;}}else{let d=random()<.5?-1:1;let moved=false;for(let s of [d,-d]){if(x+s>=0&&x+s<W&&grid[below+s]===0){swap(i,below+s);moved=true;break}}if(moved)continue;for(let s of [d,-d]){if(x+s>=0&&x+s<W&&grid[i+s]===0){swap(i,i+s);moved=true;break}}if(moved)continue;let reach=4;for(let s of [d,-d]){let best=-1;for(let n=1;n<=reach&&x+s*n>=0&&x+s*n<W;n++){let j=i+s*n;if(grid[j]!==0)break;best=j;if(y+1<H&&grid[j+W]===0)break}if(best>=0){swap(i,best);break}}}}}}
function render(){let p=img.data;for(let i=0;i<grid.length;i++){let o=i*4,t=grid[i];if(t){let c=shade[i];let f=t===2?0.90+0.1*Math.sin(frame*.055+(i%W)*.18):1;p[o]=Math.min(255,((c>>16)&255)*f);p[o+1]=Math.min(255,((c>>8)&255)*f);p[o+2]=Math.min(255,(c&255)*f);p[o+3]=255}else{let y=(i/W)|0;p[o]=5+(y/H*3|0);p[o+1]=7+(y/H*4|0);p[o+2]=15+(y/H*8|0);p[o+3]=255}}buffer.getContext('2d').putImageData(img,0,0);ctx.drawImage(buffer,0,0,canvas.width,canvas.height)}
function loop(t){try{if(!prev)prev=t;let dt=Math.min(65,t-prev);prev=t;if(playing){acc+=dt;let n=0;while(acc>=16.667&&n<3){tick();acc-=16.667;n++}}render();if(t-statTick>400){statEl.textContent=count.toLocaleString()+' particles · '+W+' × '+H+' grid';statTick=t}raf=requestAnimationFrame(loop)}catch(e){cancelAnimationFrame(raf);fail(e)}}
try{resize();addEventListener('resize',resize);raf=requestAnimationFrame(loop)}catch(e){fail(e)}
})();
</script></body></html>
