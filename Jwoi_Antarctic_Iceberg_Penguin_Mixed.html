 const edge=H*.405;

function bubbles(x,y,n=14){for(let i=0;i<n;i++)particles.push({x:x+rnd(-16,16),y:y+rnd(-8,8),vx:rnd(-1.5,1.5),vy:rnd(-3.4,-.7),r:rnd(1,5),life:rnd(.8,2.2),max:2.2})}
function ripple(x,y){ripples.push({x,y,r:3,life:1})}
function start(x,y){pointer.x=x;pointer.y=clamp(y,H*.46,H*.87);for(const f of fish){let d=Math.hypot(f.x-x,f.y-y);if(d<Math.min(W*.5,460)){let a=Math.atan2(f.y-y,f.x-x);f.vx+=Math.cos(a)*2.1;f.vy+=Math.sin(a)*1.8;f.fear=Math.max(f.fear,.65)}}if(phase==='rest'||phase==='return'){phase='dive';phaseTime=0;peng.x=W*.28;peng.y=H*.30;peng.vx=0;peng.vy=0;peng.angle=-.65;peng.goalX=pointer.x;peng.goalY=pointer.y}else{peng.goalX=pointer.x;peng.goalY=pointer.y;bubbles(peng.x,peng.y,5)}}
cvs.addEventListener('pointerdown',e=>start(e.clientX,e.clientY));
function update(dt){t+=dt;phaseTime+=dt;
if(phase==='dive'){let q=clamp(phaseTime/1.15,0,1),ease=q*q*(3-2*q);peng.x=W*.28+(peng.goalX-W*.28)*ease*.36;peng.y=H*.30+(H*.49-H*.30)*ease;peng.angle=-.7+ease*.9;if(q>.45&&q<.52){ripple(peng.x,H*.405);bubbles(peng.x,H*.41,22)}if(q>=1){phase='hunt';phaseTime=0;peng.angle=0}}
else if(phase==='hunt'){let target=null,dist=1e9;for(let f of fish)if(f.alive){let d=Math.hypot(f.x-peng.x,f.y-peng.y);if(d<dist){dist=d;target=f}}let gx=target?target.x:peng.goalX,gy=target?target.y:peng.goalY;let dx=gx-peng.x,dy=gy-peng.y,d=Math.hypot(dx,dy)||1;peng.vx+=(dx/d*4.8-peng.vx)*Math.min(1,dt*3);peng.vy+=(dy/d*3.7-peng.vy)*Math.min(1,dt*3);peng.x+=peng.vx*dt*52;peng.y+=peng.vy*dt*52;peng.x=clamp(peng.x,45,W-45);peng.y=clamp(peng.y,H*.42,H*.89);peng.angle=Math.atan2(peng.vy,peng.vx)*.55;if(Math.random()<dt*11)bubbles(peng.x-35,peng.y+5,1);if(target&&dist<Math.max(36,peng.scale*43)){target.alive=false;target.respawn=2.7;bubbles(target.x,target.y,19);ripple(target.x,target.y);caught++}if(phaseTime>12){phase='return';phaseTime=0}}
else if(phase==='return'){peng.x+=(W*.27-peng.x)*Math.min(1,dt*1.5);peng.y+=(H*.30-peng.y)*Math.min(1,dt*1.5);peng.angle+=(-.7-peng.angle)*Math.min(1,dt*3);if(phaseTime>2.5){phase='rest';phaseTime=0}}
for(let f of fish){if(!f.alive){f.respawn-=dt;if(f.respawn<=0){Object.assign(f,newFish(0));f.x=f.vx>0?-35:W+35}continue}let dx=f.x-peng.x,dy=f.y-peng.y,d=Math.hypot(dx,dy)||1;let threat=(phase==='hunt'||phase==='dive')?clamp(1-d/Math.min(W*.38,330),0,1):0;f.fear+=(threat-f.fear)*Math.min(1,dt*6);f.vx+=(Math.sign(dx||1)*f.fear*3.6+Math.sin(t*.65+f.tail)*.13-f.vx*.14)*dt*1.9;f.vy+=(Math.sign(dy||1)*f.fear*2+Math.cos(t*.6+f.tail)*.15-f.vy*.16)*dt*1.8;let speed=Math.hypot(f.vx,f.vy);if(speed>3.8){f.vx*=3.8/speed;f.vy*=3.8/speed}f.x+=f.vx*dt*53;f.y+=f.vy*dt*53;if(f.x<24){f.x=24;f.vx=Math.abs(f.vx)+.25}if(f.x>W-24){f.x=W-24;f.vx=-Math.abs(f.vx)-.25}if(f.y<H*.43){f.y=H*.43;f.vy=Math.abs(f.vy)+.25}if(f.y>H*.91){f.y=H*.91;f.vy=-Math.abs(f.vy)-.25}}
for(let p of particles){p.x+=p.vx*dt*42;p.y+=p.vy*dt*42;p.life-=dt}particles=particles.filter(p=>p.life>0);for(let r of ripples){r.r+=dt*85;r.life-=dt*.75}ripples=ripples.filter(r=>r.life>0)
}
function drawPenguin(){if(!photo.complete||!photo.naturalWidth)return;ctx.save();ctx.translate(peng.x,peng.y);let angle=phase==='rest'?-.83:peng.angle;ctx.rotate(angle);let sw=Math.max(115,Math.min(W*.20,235)),sh=sw*.66;ctx.shadowColor='rgba(0,11,24,.33)';ctx.shadowBlur=17;// Gentle flipper-like banking and underwater refraction without changing the photograph.
let flutter=phase==='hunt'?Math.sin(t*11)*.045:0;
ctx.transform(1,flutter,0,1,0,0);
ctx.drawImage(photo,-sw*.49,-sh*.50,sw,sh);
ctx.shadowBlur=0;
if(phase==='hunt'||phase==='dive'){
 ctx.globalCompositeOperation='screen';
 let gleam=ctx.createLinearGradient(-sw*.45,-sh*.5,sw*.4,sh*.5);
 gleam.addColorStop(0,'rgba(20,174,220,0)');gleam.addColorStop(.52,'rgba(110,233,255,.095)');gleam.addColorStop(1,'rgba(20,174,220,0)');
 ctx.fillStyle=gleam;ctx.fillRect(-sw*.5,-sh*.5,sw,sh);
}
ctx.restore()}
function drawForeground(){
 // Layered light shafts and suspended plankton, with parallax to suggest depth.
 ctx.save();ctx.globalCompositeOperation='screen';
 for(let i=0;i<6;i++){
  let x=W*(.09+i*.19)+Math.sin(t*.22+i)*W*.026;
  let beam=ctx.createLinearGradient(x,H*.34,x+W*.09,H);
  beam.addColorStop(0,'rgba(155,233,255,.11)');beam.addColorStop(1,'rgba(38,139,188,0)');
  ctx.fillStyle=beam;ctx.beginPath();ctx.moveTo(x-W*.012,H*.35);ctx.lineTo(x+W*.024,H*.35);
  ctx.lineTo(x+W*.13,H);ctx.lineTo(x-W*.075,H);ctx.closePath();ctx.fill();
 }
 for(let i=0;i<(W<650?45:95);i++){
  let x=((i*173.17+Math.sin(t*.15+i)*12)%W+W)%W;
  let y=((i*97.91-t*(3+i%4))%H+H)%H;
  if(y<H*.39)continue;
  let a=.06+.09*(.5+.5*Math.sin(t+i));
  ctx.fillStyle=`rgba(201,249,255,${a})`;ctx.beginPath();ctx.arc(x,y,.45+(i%3)*.25,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}
function draw(){background();drawForeground();for(let f of fish)drawFish(f);for(let p of particles){ctx.strokeStyle=`rgba(193,244,255,${clamp(p.life/2,0,.75)})`;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();ellipse(p.x-p.r*.25,p.y-p.r*.25,.7,.7,'rgba(255,255,255,.65)')}for(let r of ripples){ctx.strokeStyle=`rgba(172,239,255,${r.life*.55})`;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,r.r*.33,0,0,Math.PI*2);ctx.stroke()}drawPenguin();let v=ctx.createRadialGradient(W*.5,H*.48,W*.12,W*.5,H*.5,Math.max(W,H)*.82);v.addColorStop(0,'transparent');v.addColorStop(1,'rgba(0,9,25,.35)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}
function frame(ms){let now=ms*.001,dt=Math.min(.035,now-last||.016);last=now;update(dt);draw();requestAnimationFrame(frame)}addEventListener('resize',resize);resize();requestAnimationFrame(frame);
</script></body></html>
