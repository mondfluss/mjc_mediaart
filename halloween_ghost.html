<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE ENCHANTED CANDY HOUSE · Interactive Halloween</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05020b;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 78%,#29133a 0%,#10091e 44%,#03020a 85%)}#movie{position:absolute;width:100%;height:100%;object-fit:contain;opacity:.87;display:none}#fx{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(3,2,10,.15),transparent 35%,rgba(3,2,10,.25));}#moon{position:absolute;top:9%;right:14%;width:min(13vw,110px);aspect-ratio:1;border-radius:50%;background:#f7e3c1;box-shadow:0 0 40px 12px #d1b0ee66,0 0 120px 45px #af7dff24;opacity:.83;pointer-events:none}#top{position:absolute;top:18px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:start;gap:12px;pointer-events:none}#top h1{font-family:Georgia,serif;font-weight:400;letter-spacing:.16em;font-size:clamp(16px,2.1vw,30px);margin:0;color:#ffe8c1;text-shadow:0 0 18px #f5b0ff77}#top p{margin:7px 0 0;font-size:12px;letter-spacing:.14em;color:#c8a9e6}.tag{font-size:11px;letter-spacing:.12em;color:#d7b6f8;border:1px solid #b489d055;padding:8px 12px;border-radius:40px;background:#1c0e2b77}#panel{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:min(900px,calc(100% - 24px));padding:12px;border:1px solid #d5abfa50;border-radius:18px;background:#0d0718d9;backdrop-filter:blur(16px);box-shadow:0 12px 45px #0009;display:flex;gap:9px;flex-wrap:wrap;justify-content:center;align-items:center}button,.upload{background:#291639;border:1px solid #ab83d86b;color:#f9ecff;border-radius:10px;padding:10px 13px;cursor:pointer;font:inherit;font-size:12px;white-space:nowrap}button:hover,.upload:hover{background:#4a265d}button:focus-visible,.upload:focus-visible{outline:2px solid #ffe3a4}input[type=file]{display:none}#status{font-size:11px;color:#d6bfdc;flex-basis:100%;text-align:center;line-height:1.5}#help{position:absolute;top:95px;left:24px;max-width:280px;color:#f2dcffb3;font-size:12px;line-height:1.7;pointer-events:none}#camPreview{position:absolute;right:18px;bottom:112px;width:150px;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:1px solid #ba89d8;transform:scaleX(-1);display:none;opacity:.7}#hint{position:absolute;bottom:123px;left:50%;transform:translateX(-50%);font-size:12px;color:#f3d9ffcc;text-align:center;pointer-events:none;white-space:nowrap}#scene{position:absolute;top:92px;right:22px;font-size:12px;letter-spacing:.08em;color:#f4d2a6;background:#12081eb8;border:1px solid #bd90ce44;padding:9px 12px;border-radius:9px;pointer-events:none}@media(max-width:650px){#top{left:14px;right:14px;top:14px}#top h1{font-size:16px}#top p{font-size:9px}#help{top:76px;left:14px;font-size:10px;max-width:190px}#scene{top:80px;right:10px;font-size:10px}#hint{bottom:155px;white-space:normal;width:85%}#camPreview{bottom:160px;width:95px}#panel{bottom:8px;gap:5px;padding:8px}button,.upload{padding:9px;font-size:11px}}
</style></head><body><main id="stage"><video id="movie" playsinline preload="auto"></video><div id="moon"></div><canvas id="fx" aria-label="손동작과 마우스에 반응하는 할로윈 마법 유령"></canvas><div id="veil"></div><header id="top"><div><h1>THE ENCHANTED CANDY HOUSE</h1><p>HANSEL & GRETEL · HALLOWEEN MAGIC</p></div><div class="tag">INTERACTIVE FAIRY TALE</div></header><div id="help">✦ 손을 펼치면 마법 유령이 피어나요<br>✦ 주먹을 쥐면 유령이 작아져요<br>✦ 손을 빠르게 움직이면 빛이 흩날려요<br>✦ 카메라 없이 마우스로도 체험할 수 있어요</div><div id="scene">SCENE 01 · 마법의 숲</div><div id="hint">마우스를 움직여 보세요 · 숫자 0~5로 유령 크기 조절 · 클릭하면 마법 폭발</div><video id="camPreview" autoplay muted playsinline></video><section id="panel"><label class="upload" for="file">🎬 30초 영상 불러오기</label><input id="file" type="file" accept="video/*"><button id="play">▶ 영상 재생</button><button id="cam">✋ 손 인식 시작</button><button id="mode">🖱 마우스 모드</button><button id="sound">🔊 소리 켜기</button><button id="bg" aria-pressed="false">⬛ 검정 배경</button><button id="full">⛶ 전체화면</button><div id="status" role="status" aria-live="polite">준비 완료 · 마우스 모드에서 즉시 체험할 수 있어요</div></section></main>
<script type="module">
const stage=document.getElementById('stage'),canvas=document.getElementById('fx'),ctx=canvas.getContext('2d'),movie=document.getElementById('movie'),status=document.getElementById('status'),preview=document.getElementById('camPreview'),moon=document.getElementById('moon'),sceneLabel=document.getElementById('scene');let W=innerWidth,H=innerHeight,dpr=1,particles=[],stars=[],fog=[],pumpkins=[],handX=.5,handY=.55,targetX=.5,targetY=.55,open=5,openness=1,mode='mouse',lastX=.5,lastY=.55,videoURL=null,stream=null,landmarker=null,trackingBusy=false,lastDetect=0,animationTime=0,blackBackground=false;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.max(70,Math.floor(W*H/12000))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.7+.3,a:Math.random()*6}));fog=Array.from({length:7},(_,i)=>({x:Math.random()*W,y:H*(.55+i*.065),r:W*(.24+Math.random()*.3),speed:(Math.random()-.5)*.25}));pumpkins=Array.from({length:7},(_,i)=>({x:W*(.07+i*.145),y:H*(.81+Math.random()*.13),r:Math.min(W/27,28)*(0.6+Math.random()*.65),phase:Math.random()*6}));}addEventListener('resize',resize);resize();
function setStatus(t){status.textContent=t}function burst(x,y,n=35,colors=['#f5c468','#f0a7ff','#a2d7ff']){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*5+1;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,decay:.008+Math.random()*.015,r:Math.random()*3+1,color:colors[Math.floor(Math.random()*colors.length)]});}if(particles.length>900)particles.splice(0,particles.length-900)}
function drawForest(t){if(blackBackground)return;if(movie.style.display!=='block'){ctx.save();const ground=ctx.createLinearGradient(0,H*.7,0,H);ground.addColorStop(0,'#0d0a17');ground.addColorStop(1,'#07050b');ctx.fillStyle=ground;ctx.fillRect(0,H*.75,W,H*.25);ctx.strokeStyle='#100b17';ctx.lineCap='round';for(let i=0;i<12;i++){let x=W*(i/11),s=(i%3+2)*.4;ctx.lineWidth=14*s;ctx.beginPath();ctx.moveTo(x,H);ctx.lineTo(x+(i%2?45:-45),H*.08);ctx.stroke();ctx.lineWidth=6*s;for(let j=0;j<4;j++){let yy=H*(.18+j*.13);ctx.beginPath();ctx.moveTo(x+(i%2?45:-45)*(H-yy)/(H*.92),yy);ctx.lineTo(x+(i%2?-1:1)*(45+j*20),yy-65);ctx.stroke();}}for(const p of pumpkins){let glow=.55+.25*Math.sin(t*.002+p.phase);ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#a54c18';ctx.beginPath();ctx.ellipse(0,0,p.r*.95,p.r*.8,0,0,7);ctx.fill();ctx.strokeStyle='#f39b3d';ctx.lineWidth=1;for(let k=-1;k<=1;k++){ctx.beginPath();ctx.ellipse(k*p.r*.3,0,p.r*.35,p.r*.8,0,0,7);ctx.stroke()}ctx.fillStyle=`rgba(255,194,75,${glow})`;ctx.shadowBlur=25;ctx.shadowColor='#ffa23d';ctx.beginPath();ctx.moveTo(-p.r*.5,-p.r*.1);ctx.lineTo(-p.r*.2,-p.r*.25);ctx.lineTo(-p.r*.15,p.r*.03);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(p.r*.15,-p.r*.25);ctx.lineTo(p.r*.5,-p.r*.1);ctx.lineTo(p.r*.13,p.r*.03);ctx.fill();ctx.beginPath();ctx.arc(0,p.r*.14,p.r*.43,0,Math.PI);ctx.fill();ctx.restore()}ctx.restore();}for(const s of stars){let a=.3+.4*(.5+.5*Math.sin(t*.001+s.a));ctx.fillStyle=`rgba(237,200,255,${a})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}for(const f of fog){f.x+=f.speed;if(f.x>W+f.r)f.x=-f.r;if(f.x< -f.r)f.x=W+f.r;let g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);g.addColorStop(0,'rgba(131,65,179,.10)');g.addColorStop(1,'rgba(131,65,179,0)');ctx.fillStyle=g;ctx.fillRect(f.x-f.r,f.y-f.r,f.r*2,f.r*2)}}
function flower(t){
 handX+=(targetX-handX)*.19;handY+=(targetY-handY)*.19;
 const x=handX*W,y=handY*H, r=Math.max(35,Math.min(W,H)*.075), spread=.55+openness*.65;
 ctx.save();ctx.translate(x,y+Math.sin(t*.003)*5);ctx.scale(spread,spread);
 const halo=ctx.createRadialGradient(0,0,5,0,0,r*2.7);halo.addColorStop(0,'rgba(180,145,255,.38)');halo.addColorStop(1,'rgba(110,60,210,0)');ctx.fillStyle=halo;ctx.beginPath();ctx.arc(0,0,r*2.7,0,Math.PI*2);ctx.fill();
 // Floating friendly Halloween ghost with waving scalloped tail.
 ctx.save();ctx.shadowColor='#b39aff';ctx.shadowBlur=28;
 const g=ctx.createLinearGradient(-r,-r,r,r);g.addColorStop(0,'#ffffff');g.addColorStop(.52,'#f1eaff');g.addColorStop(1,'#b9a4ef');ctx.fillStyle=g;
 ctx.beginPath();ctx.moveTo(-r*.77,r*.6);ctx.lineTo(-r*.77,-r*.14);ctx.bezierCurveTo(-r*.8,-r*1.4,r*.8,-r*1.4,r*.77,-r*.14);ctx.lineTo(r*.77,r*.6);
 ctx.quadraticCurveTo(r*.56,r*.97,r*.34,r*.63);ctx.quadraticCurveTo(r*.13,r*1.04,-r*.08,r*.67);ctx.quadraticCurveTo(-r*.35,r*1.04,-r*.51,r*.67);ctx.quadraticCurveTo(-r*.67,r*.84,-r*.77,r*.6);ctx.closePath();ctx.fill();ctx.restore();
 // Little arms become more expressive when fingers open.
 ctx.strokeStyle='#e5d8ff';ctx.lineWidth=r*.22;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-r*.68,r*.05);ctx.quadraticCurveTo(-r*(.92+openness*.35),-r*(.15+openness*.32),-r*(1+openness*.45),-r*(.02+openness*.45));ctx.moveTo(r*.68,r*.05);ctx.quadraticCurveTo(r*(.92+openness*.35),-r*(.15+openness*.32),r*(1+openness*.45),-r*(.02+openness*.45));ctx.stroke();
 ctx.fillStyle='#28203f';for(const eye of [-1,1]){ctx.beginPath();ctx.ellipse(eye*r*.28,-r*.24,r*.105,r*.17,0,0,Math.PI*2);ctx.fill()}
 ctx.fillStyle='#f1a5c7';for(const cheek of [-1,1]){ctx.beginPath();ctx.ellipse(cheek*r*.46,r*.05,r*.13,r*.07,0,0,Math.PI*2);ctx.fill()}
 ctx.strokeStyle='#44315e';ctx.lineWidth=Math.max(2,r*.04);ctx.beginPath();ctx.arc(0,r*.04,r*.14,.1,Math.PI-.1);ctx.stroke();
 ctx.restore();
 if(Math.random()<.36)particles.push({x:x+(Math.random()-.5)*r*2,y:y+(Math.random()-.5)*r*2,vx:(Math.random()-.5)*1.8,vy:-Math.random()*1.6,life:1,decay:.015,r:1+Math.random()*2,color:Math.random()>.5?'#e9b7ff':'#f8c875'});
}
function drawParticles(){ctx.save();ctx.globalCompositeOperation='lighter';for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.015;p.vx*=.995;p.life-=p.decay;if(p.life<=0){particles.splice(i,1);continue}ctx.globalAlpha=p.life;ctx.shadowColor=p.color;ctx.shadowBlur=14;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,7);ctx.fill()}ctx.restore()}
function frame(t){animationTime=t;ctx.clearRect(0,0,W,H);drawForest(t);flower(t);drawParticles();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function pointer(x,y){const dx=x-targetX,dy=y-targetY;targetX=Math.min(1,Math.max(0,x));targetY=Math.min(1,Math.max(0,y));if(Math.hypot(dx,dy)>.07)burst(targetX*W,targetY*H,12)}canvas.addEventListener('pointermove',e=>{if(mode==='mouse')pointer(e.clientX/W,e.clientY/H)});canvas.addEventListener('pointerdown',e=>{if(mode==='mouse'){pointer(e.clientX/W,e.clientY/H);burst(e.clientX,e.clientY,75)}});addEventListener('keydown',e=>{if(/^[0-5]$/.test(e.key)){open=Number(e.key);openness=open/5;setStatus(`마우스 모드 · 유령 마법 단계 ${open}/5`)}if(e.code==='Space'&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();burst(handX*W,handY*H,80)}});
const bgButton=document.getElementById('bg');
function updateBackground(){
 stage.style.background=blackBackground?'#000':'';
 movie.style.visibility=blackBackground?'hidden':'';
 moon.style.visibility=blackBackground?'hidden':'';
 document.getElementById('veil').style.visibility=blackBackground?'hidden':'';
 bgButton.textContent=blackBackground?'🌲 원래 배경':'⬛ 검정 배경';
 bgButton.setAttribute('aria-pressed',String(blackBackground));
 setStatus(blackBackground?'검정 배경 모드 · 유령과 마법 입자는 그대로 움직입니다.':'할로윈 배경 모드로 돌아왔습니다.');
}
bgButton.onclick=()=>{blackBackground=!blackBackground;updateBackground()};
const labels=['마법의 숲','마법의 주방','할로윈 쿠키','과자집 조립','마녀의 등장','황금빛 엔딩'];movie.addEventListener('timeupdate',()=>{let n=Math.min(5,Math.floor(movie.currentTime/5));sceneLabel.textContent=`SCENE ${String(n+1).padStart(2,'0')} · ${labels[n]}`});movie.addEventListener('ended',()=>{document.getElementById('play').textContent='▶ 다시 재생';burst(W*.5,H*.48,180)});document.getElementById('file').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;if(videoURL)URL.revokeObjectURL(videoURL);videoURL=URL.createObjectURL(f);movie.src=videoURL;movie.style.display='block';moon.style.opacity='.15';movie.load();setStatus(`영상 연결 완료: ${f.name} · 재생 버튼을 눌러 주세요`)});document.getElementById('play').onclick=async()=>{if(!videoURL){setStatus('먼저 「30초 영상 불러오기」로 MP4를 선택해 주세요. 영상 없이도 마법 효과는 작동합니다.');return}try{if(movie.paused){await movie.play();document.getElementById('play').textContent='⏸ 일시정지'}else{movie.pause();document.getElementById('play').textContent='▶ 영상 재생'}}catch(e){setStatus('영상 재생 실패: '+e.message)}};movie.muted=true;document.getElementById('sound').onclick=()=>{movie.muted=!movie.muted;document.getElementById('sound').textContent=movie.muted?'🔊 소리 켜기':'🔇 소리 끄기'};document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await stage.requestFullscreen()}catch(e){setStatus('전체화면 전환 실패: '+e.message)}};
async function stopCam(){mode='mouse';if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}preview.srcObject=null;preview.style.display='none';document.getElementById('cam').textContent='✋ 손 인식 시작';setStatus('마우스 모드 · 마우스 이동 / 클릭 / 숫자 0~5 사용 가능')}
document.getElementById('mode').onclick=stopCam;
function angle(a,b,c){const v=[a.x-b.x,a.y-b.y],w=[c.x-b.x,c.y-b.y],dot=v[0]*w[0]+v[1]*w[1],len=Math.hypot(...v)*Math.hypot(...w);return len?Math.acos(Math.max(-1,Math.min(1,dot/len)))*180/Math.PI:0}function countFingers(l){let count=0;for(const [m,p,tip] of [[5,6,8],[9,10,12],[13,14,16],[17,18,20]])if(angle(l[m],l[p],l[tip])>155)count++;if(angle(l[2],l[3],l[4])>150&&Math.hypot(l[4].x-l[17].x,l[4].y-l[17].y)>Math.hypot(l[3].x-l[17].x,l[3].y-l[17].y)*1.12)count++;return count}
async function startCam(){if(mode==='camera')return;setStatus('카메라 권한과 손 인식 모델을 준비하고 있어요…');try{if(!navigator.mediaDevices?.getUserMedia)throw Error('이 브라우저/실행 환경에서는 카메라 접근이 지원되지 않습니다. 마우스 모드를 이용하세요.');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});preview.srcObject=stream;await preview.play();preview.style.display='block';const mod=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');const vision=await mod.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');landmarker=await mod.HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:1});mode='camera';document.getElementById('cam').textContent='✋ 손 인식 중';setStatus('손 인식 활성화 · 손을 펼치거나 주먹을 쥐고 움직여 보세요');requestAnimationFrame(track)}catch(e){await stopCam();setStatus('카메라/손 인식 사용 불가: '+e.message+' · 마우스로 계속 체험할 수 있어요')}}
function track(now){if(mode!=='camera')return;if(preview.readyState>=2&&now-lastDetect>45){lastDetect=now;try{const r=landmarker.detectForVideo(preview,now);if(r.landmarks?.length){const l=r.landmarks[0],p=l[9];const x=1-p.x,y=p.y;const dx=x-targetX,dy=y-targetY;pointer(x,y);const n=countFingers(l);open=n;openness=n/5;if(Math.hypot(dx,dy)>.065)burst(x*W,y*H,16)}}catch(e){setStatus('손 추적 오류: '+e.message)}}requestAnimationFrame(track)}document.getElementById('cam').onclick=startCam;window.addEventListener('beforeunload',()=>{stream?.getTracks().forEach(t=>t.stop());if(videoURL)URL.revokeObjectURL(videoURL)});
</script></body></html>
